<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'unsafe-inline'; script-src 'self' 'unsafe-inline'">
<title>Server settings</title>
<style>
 *{box-sizing:border-box} body{margin:0;font-family:Segoe UI,system-ui,sans-serif;background:#eef4f7;color:#12303d;padding:22px}
 h1{font-size:1.2rem;margin:0 0 6px} .demo{background:#fff3cd;color:#664d03;border-radius:6px;padding:5px 9px;font-size:.8rem;margin-bottom:14px;display:inline-block}
 label{display:block;font-weight:600;margin:12px 0 5px} input{width:100%;font-size:1rem;padding:9px;border:1px solid #9db4bf;border-radius:6px}
 button{font-size:.95rem;padding:9px 14px;border:0;border-radius:6px;margin:12px 8px 0 0;background:#0b7285;color:#fff;font-weight:600;cursor:pointer}
 button.s{background:#dbe7ec;color:#12303d} #msg{margin-top:12px;min-height:1.4em;font-size:.92rem} .err{color:#b02a37}.ok{color:#146c43} small{color:#51707d}
</style>
</head>
<body>
<h1>Server settings</h1><div class="demo">DEMO ONLY - synthetic data</div>
<label for="url">Health Portal server URL</label>
<input id="url" placeholder="http://192.168.1.50:8000" autocomplete="off" spellcheck="false">
<small>The hospital portal opens at &lt;URL&gt;/staff/ . Saving restarts the app.</small>
<div id="msg"></div>
<button id="save">Save &amp; restart</button><button class="s" id="test">Test</button>
<button class="s" id="reset">Reset to default</button><button class="s" id="close">Cancel</button>
<script>
const $ = (id) => document.getElementById(id);
const say = (m, c) => { $("msg").textContent = m; $("msg").className = c || ""; };
hp.getSettings().then((s) => { $("url").value = s.serverUrl; });
$("test").onclick = async () => { say("Testing..."); const r = await hp.test($("url").value); say(r.message, r.ok ? "ok" : "err"); };
$("save").onclick = async () => { const r = await hp.save($("url").value); if (!r.ok) say(r.message, "err"); };
$("reset").onclick = () => hp.reset();
$("close").onclick = () => hp.close();
$("url").addEventListener("keydown", (e) => { if (e.key === "Enter") $("save").click(); });
</script>
</body>
</html>
