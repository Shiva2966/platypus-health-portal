<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Health Portal</title>
<style>
  * { box-sizing: border-box; }
  body { margin: 0; min-height: 100vh; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 14px;
         font-family: system-ui, Roboto, sans-serif; color: #fff; background: linear-gradient(135deg, #0b4f8a, #0f7ba8); text-align: center; padding: 24px; }
  h1 { margin: 0; font-size: 2rem; font-weight: 800; }
  p { margin: 0; opacity: .9; }
  button { display: none; font-size: 1rem; font-weight: 700; padding: 14px 28px; border: 0; border-radius: 12px; background: #fff; color: #0b4f8a; }
  .spin { width: 34px; height: 34px; border: 4px solid rgba(255,255,255,.35); border-top-color: #fff; border-radius: 50%; animation: s 1s linear infinite; }
  @keyframes s { to { transform: rotate(360deg); } }
</style>
</head>
<body>
<h1>Health Portal</h1>
<div class="spin" id="spin"></div>
<p id="msg">Connecting...</p>
<button id="retry">Try again</button>
<script>
(function () {
  var SERVER = "";   // filled from server-default.json (written by start_public.ps1 / config/server.json)
  var tries = 0;
  function ok(url) {
    var c = new AbortController(), t = setTimeout(function () { c.abort(); }, 9000);
    return fetch(url + "/healthz", { mode: "no-cors", cache: "no-store", signal: c.signal })
      .then(function () { clearTimeout(t); return true; }).catch(function () { clearTimeout(t); return false; });
  }
  function go() {
    document.getElementById("retry").style.display = "none";
    document.getElementById("spin").style.display = "block";
    document.getElementById("msg").textContent = "Connecting...";
    ok(SERVER).then(function (up) {
      if (up) { location.replace(SERVER + "/"); return; }
      if (++tries < 5) { setTimeout(go, 2500); return; }
      tries = 0;
      document.getElementById("spin").style.display = "none";
      document.getElementById("msg").textContent = "Can't reach the server right now. Check your internet and try again.";
      document.getElementById("retry").style.display = "inline-block";
    });
  }
  document.getElementById("retry").onclick = go;
  fetch("server-default.json", { cache: "no-store" }).then(function (r) { return r.json(); })
    .then(function (j) { SERVER = String(j.serverUrl || "").replace(/\/+$/, ""); })
    .catch(function () {})
    .then(function () {
      if (!SERVER) { document.getElementById("msg").textContent = "App is not configured."; document.getElementById("spin").style.display = "none"; return; }
      go();
    });
})();
</script>
</body>
</html>
