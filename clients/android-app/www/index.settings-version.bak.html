<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Health Portal - Settings</title>
<style>
  :root { color-scheme: light; }
  * { box-sizing: border-box; }
  body { margin: 0; font-family: system-ui, Roboto, sans-serif; background: #eef4f7; color: #12303d;
         min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 16px; }
  .card { background: #fff; border-radius: 14px; padding: 22px; width: 100%; max-width: 440px;
          box-shadow: 0 4px 18px rgba(0,0,0,.12); }
  h1 { font-size: 1.3rem; margin: 0 0 4px; }
  .demo { background: #fff3cd; color: #664d03; border-radius: 8px; padding: 6px 10px; font-size: .8rem; margin-bottom: 14px; }
  label { display: block; font-weight: 600; margin: 14px 0 6px; }
  input { width: 100%; font-size: 1rem; padding: 12px; border: 1px solid #9db4bf; border-radius: 8px; }
  button { font-size: 1rem; padding: 12px 14px; border: 0; border-radius: 8px; margin-top: 12px; width: 100%;
           background: #0b7285; color: #fff; font-weight: 600; }
  button.secondary { background: #dbe7ec; color: #12303d; }
  #status { margin-top: 12px; min-height: 1.4em; font-size: .92rem; }
  .err { color: #b02a37; } .ok { color: #146c43; }
  small { color: #51707d; }
  .hidden { display: none; }
</style>
</head>
<body>
<div class="card">
  <h1>Health Portal</h1>
  <div class="demo">DEMO ONLY - synthetic data, not for real health information.</div>

  <div id="connecting" class="hidden">
    <p>Connecting to <b id="connUrl"></b> ...</p>
    <button class="secondary" id="cancelBtn">Change server</button>
  </div>

  <div id="settings" class="hidden">
    <label for="url">Server URL</label>
    <input id="url" type="url" inputmode="url" autocapitalize="off" autocomplete="off" spellcheck="false"
           placeholder="https://your-portal-address">
    <small>Paste the portal address (https://...). It is filled in automatically from the build.</small>
    <div id="status"></div>
    <button id="saveBtn">Save &amp; open portal</button>
    <button class="secondary" id="testBtn">Test connection</button>
    <button class="secondary" id="resetBtn">Reset to build default</button>
    <button class="secondary" id="exitBtn">Exit app</button>
    <p><small>Tip: press the Back button while on the portal's first page to return to this screen.</small></p>
  </div>
</div>

<script>
(function () {
  var KEY = "hp_server_url";
  var $ = function (id) { return document.getElementById(id); };
  var params = new URLSearchParams(location.search);
  var defaultUrl = "http://192.168.1.50:8000";
  var cancelled = false;

  function normalize(u) {
    u = (u || "").trim();
    if (!u) return "";
    if (!/^https?:\/\//i.test(u)) u = (/^(\d{1,3}\.){3}\d{1,3}|^localhost/i.test(u) ? "http://" : "https://") + u;
    return u.replace(/\/+$/, "");
  }

  function check(url, ms) {
    // no-cors: we only need to know the server answered at all.
    var ctl = new AbortController();
    var t = setTimeout(function () { ctl.abort(); }, ms || 6000);
    return fetch(url + "/", { mode: "no-cors", cache: "no-store", signal: ctl.signal })
      .then(function () { clearTimeout(t); return true; })
      .catch(function () { clearTimeout(t); return false; });
  }

  function say(msg, cls) { var s = $("status"); s.textContent = msg; s.className = cls || ""; }

  function showSettings(msg, cls) {
    $("connecting").classList.add("hidden");
    $("settings").classList.remove("hidden");
    $("url").value = localStorage.getItem(KEY) || defaultUrl;
    if (msg) say(msg, cls);
  }

  function open(url) { location.replace(url + "/"); }

  $("saveBtn").onclick = function () {
    var u = normalize($("url").value);
    if (!u) return say("Enter a server URL first.", "err");
    localStorage.setItem(KEY, u);
    say("Saved. Opening...", "ok");
    open(u);
  };
  $("testBtn").onclick = function () {
    var u = normalize($("url").value);
    if (!u) return say("Enter a server URL first.", "err");
    say("Testing " + u + " ...");
    check(u, 6000).then(function (ok) {
      say(ok ? "Server reachable." : "Cannot reach " + u + ". Check IP, Wi-Fi, firewall, and that the backend is running.", ok ? "ok" : "err");
    });
  };
  $("resetBtn").onclick = function () { localStorage.removeItem(KEY); $("url").value = defaultUrl; say("Reset to build default."); };
  $("exitBtn").onclick = function () {
    try { window.Capacitor.Plugins.App.exitApp(); } catch (e) { say("Use the Android home button to leave the app."); }
  };
  $("cancelBtn").onclick = function () { cancelled = true; showSettings(); };

  fetch("server-default.json", { cache: "no-store" })
    .then(function (r) { return r.json(); })
    .then(function (j) { if (j && j.serverUrl) defaultUrl = normalize(j.serverUrl); })
    .catch(function () {})
    .then(function () {
      var stored = localStorage.getItem(KEY);
      var seenDefault = localStorage.getItem(KEY + "_default");
      if (defaultUrl && seenDefault !== defaultUrl) {      // new build default (e.g. new tunnel URL) -> use it
        localStorage.setItem(KEY + "_default", defaultUrl);
        if (seenDefault !== null || !stored) { stored = defaultUrl; localStorage.setItem(KEY, stored); }
      }
      if (params.get("settings") === "1") {
        return showSettings(params.get("error") ? "Could not load the portal. Check the URL below." : "", "err");
      }
      if (!stored) stored = defaultUrl && !/192\.168\.1\.50/.test(defaultUrl) ? defaultUrl : "";
      if (!stored) return showSettings("First run: enter the server URL.");
      $("connUrl").textContent = stored;
      $("connecting").classList.remove("hidden");
      var tries = 0;
      (function attempt() {
        check(stored, 8000).then(function (ok) {
          if (cancelled) return;
          if (ok) return open(stored);
          if (stored !== defaultUrl && defaultUrl) {      // saved URL dead: try the build default once
            return check(defaultUrl, 8000).then(function (ok2) {
              if (cancelled) return;
              if (ok2) { localStorage.setItem(KEY, defaultUrl); return open(defaultUrl); }
              next();
            });
          }
          next();
        });
        function next() {
          if (++tries < 4) { $("connUrl").textContent = stored + " (retry " + tries + ")"; return setTimeout(attempt, 2500); }
          showSettings("Cannot reach " + stored + ". Is the server running? Fix the URL or tap Save to retry.", "err");
        }
      })();
    });
})();
</script>
</body>
</html>
