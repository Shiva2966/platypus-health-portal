<html lang="en">
<head>

  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Platypus (Demo)</title>
  <meta name="theme-color" content="#0b4f8a">
  <link rel="manifest" href="/manifest.webmanifest">
  <link rel="icon" href="/static/icons/icon-192.png">

  <a class="skip" href="#main">Skip to main content</a>
  <div class="demo-banner" role="note">DEMO ONLY &mdash; synthetic data &mdash; not for real medical use</div>

    <header class="top">

      <span id="who" class="muted"></span>
      <button id="logout-btn" class="btn small">Sign out</button>
    </header>
    <div class="layout">
      <nav id="nav-main" class="main" aria-label="Main navigation"><ul id="nav-list"></ul></nav>
      <main id="main" tabindex="-1" aria-live="polite"></main>
    </div>
  </div>
  <div id="auth-view"></div>
  <div class="toasts" id="toasts" role="status" aria-live="polite"></div>
  <noscript><p class="card err">This app needs JavaScript. Please turn it on in your browser.</p></noscript>
  <!-- Every module, in load order (shell first; *_common before its siblings). A new module needs a tag here;
       tests/test_robust_wiring.py fails if a file in /static/js is not listed. shell.js shows an error banner
       if any of these fails to load. -->
  <script src="/static/js/shell.js?v=16"></script>
